name: Build Messages Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        run: |
          cd android
          gradle assemble --stacktrace

      - name: Prepare APK in public downloads
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/Messages.apk 2>/dev/null || cp android/app/build/outputs/apk/debug/*.apk public/downloads/Messages.apk 2>/dev/null || cp android/app/build/outputs/apk/release/*.apk public/downloads/Messages.apk

      - name: Commit and Push APK to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/downloads/Messages.apk
          git commit -m "chore(apk): update public/downloads/Messages.apk [skip ci]" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Messages APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-apk
          name: "Messages Android App v1.0"
          body: "Official standalone Messages Android APK for ShabikiMarket."
          files: public/downloads/Messages.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
